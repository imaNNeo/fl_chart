name: fl_chart_playground
description: "Interactive demos of the fl_chart properties, embedded in the docs of flchart.dev."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.0

dependencies:
  fl_chart:
    path: ../
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    # https://github.com/googlefonts/RobotoMono, see assets/fonts/OFL.txt
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf
