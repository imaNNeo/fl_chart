name: Website

on:
  pull_request:
    paths:
      - 'lib/**'
      - 'playground/**'
      - 'repo_files/documentations/**'
      - 'tool/api_docs/**'
      - 'website/**'
      - '.github/workflows/website.yml'
  # The docs of flchart.dev follow the version that is on pub.dev.
  release:
    types: [published]
  # For a doc-only fix between two releases, run it on the latest tag.
  workflow_dispatch:

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Renders every value of every control of the playground.
      - name: Test the playground
        working-directory: playground
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci

      - name: Build the playground
        run: npm run build:playground

      # Fails on broken links, broken anchors and invalid markdown.
      - run: npm run build

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: website
          path: website/build

  deploy:
    name: Deploy to flchart.dev
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: website
          path: build

      # flchart.dev is served from the gh-pages branch of imaNNeo/fl_chart_landing.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.LANDING_DEPLOY_KEY }}
          external_repository: imaNNeo/fl_chart_landing
          publish_branch: gh-pages
          publish_dir: ./build
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
